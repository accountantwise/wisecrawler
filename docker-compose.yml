services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    environment:
      - PORT=${PORT:-3002}
      - REDIS_URL=redis://redis:6379/0
      - PLAYWRIGHT_TIMEOUT=${PLAYWRIGHT_TIMEOUT:-30000}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-5}
      - API_KEY=${API_KEY:-}
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.crawler worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PLAYWRIGHT_TIMEOUT=${PLAYWRIGHT_TIMEOUT:-30000}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-5}
      - API_KEY=${API_KEY:-}
    depends_on:
      - redis

volumes:
  redis_data:
